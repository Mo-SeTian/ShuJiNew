name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 构建 Debug APK
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 授权 Gradle
        run: |
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: 单元测试
        env:
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 上传单元测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: 代码检查 (lint)
        env:
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: 构建 Debug APK
        env:
          UMENG_APP_KEY: ${{ secrets.UMENG_APP_KEY }}
        run: |
          echo "开始构建 Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "=== Gradle 构建失败 ==="
            tail -200 build.log
            exit 1
          }
          echo "=== 构建完成 ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK目录不存在"

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 计算 APK MD5 并重命名
        id: rename
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          MD5=$(md5 -q "$APK_PATH" | cut -c1-7)
          NEW_NAME="ShuJi-v${{ steps.version.outputs.version }}-CI-${MD5}.apk"
          cp "$APK_PATH" "app/build/outputs/apk/debug/$NEW_NAME"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "new_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "MD5 前缀: $MD5"
          echo "新文件名: $NEW_NAME"
          ls -lh "app/build/outputs/apk/debug/$NEW_NAME"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 检查 APK 文件
        run: |
          echo "=== 检查 APK ==="
          echo "当前目录: $(pwd)"
          APK_PATH="app/build/outputs/apk/debug/${{ steps.rename.outputs.new_name }}"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK 文件存在!"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK 文件不存在"
            echo "=== app/build 目录结构 ==="
            ls -laR app/build/ 2>/dev/null | head -100
            echo "=== build.log 最后 200 行 ==="
            tail -200 build.log 2>/dev/null || echo "build.log 不存在"
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ShuJi-v${{ steps.version.outputs.version }}-CI-${{ steps.rename.outputs.md5 }}
          path: app/build/outputs/apk/debug/${{ steps.rename.outputs.new_name }}
          retention-days: 30
