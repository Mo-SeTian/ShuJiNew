name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to sync (e.g., v1.9.6)'
        required: true
        default: 'v1.9.6'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release info
        id: release_info
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag || github.event.release.tag_name }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Checkout repo (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch tag for release
        run: |
          git fetch origin refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}

      - name: Initialize Gitee repo (create main branch if empty)
        run: |
          # Check if Gitee already has main or master branch
          RESPONSE_MAIN=$(curl -s -H "Authorization: Bearer ${{ secrets.GITEE_TOKEN }}" \
            "https://gitee.com/api/v5/repos/mosetian/shu-ji-new/branches/main")
          RESPONSE_MASTER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITEE_TOKEN }}" \
            "https://gitee.com/api/v5/repos/mosetian/shu-ji-new/branches/master")
          if echo "$RESPONSE_MAIN" | jq -e '.name' > /dev/null 2>&1; then
            echo "Gitee main branch exists"
          elif echo "$RESPONSE_MASTER" | jq -e '.name' > /dev/null 2>&1; then
            echo "Gitee master branch exists"
          else
            echo "Gitee repo is empty, initializing with README..."
            README_B64=$(echo "# ShuJiNew" | base64)
            RESP=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/mosetian/shu-ji-new/files/README.md?access_token=${{ secrets.GITEE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"Initial commit\",\"content\":\"${README_B64}\"}")
            echo "Init response: $RESP"
          fi

      - name: Push main branch to Gitee
        run: |
          git remote add gitee "https://mosetian:${{ secrets.GITEE_TOKEN }}@gitee.com/mosetian/shu-ji-new.git"
          # Try pushing to main first, fall back to master
          git push gitee main:main 2>/dev/null || git push gitee main:master
          echo "Main branch pushed"

      - name: Download release APK
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            | jq -r '.id')
          echo "GitHub release ID: $RELEASE_ID"
          ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            | jq -r '.[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)
          if [ -n "$ASSET_URL" ]; then
            curl -L -o readtrack.apk "$ASSET_URL"
            echo "APK downloaded: $(ls -lh readtrack.apk)"
          else
            echo "No APK asset found"
          fi

      - name: Push tag to Gitee
        run: |
          # Push the specific tag to Gitee using the token
          git remote add gitee "https://mosetian:${{ secrets.GITEE_TOKEN }}@gitee.com/mosetian/shu-ji-new.git"
          git push gitee refs/tags/${RELEASE_TAG}
          echo "Tag ${RELEASE_TAG} pushed to Gitee"

      - name: Create or update release on Gitee
        id: create_release
        run: |
          # Try to get existing release by tag first
          EXISTING=$(curl -s -H "Authorization: Bearer ${{ secrets.GITEE_TOKEN }}" \
            "https://gitee.com/api/v5/repos/mosetian/shu-ji-new/releases/tags/${RELEASE_TAG}")
          echo "Existing release check: $EXISTING"
          EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Release already exists with ID: $EXISTING_ID"
            echo "RELEASE_ID=$EXISTING_ID" >> $GITHUB_ENV
          else
            echo "Creating new release..."
            TAG_NAME="${RELEASE_TAG}"
            BODY_URL="https://github.com/Mo-SeTian/ShuJiNew/releases/tag/${RELEASE_TAG}"
            RESPONSE=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/mosetian/shu-ji-new/releases?access_token=${{ secrets.GITEE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"书迹 ${TAG_NAME}\",\"body\":\"${BODY_URL}\",\"target_commitish\":\"${TAG_NAME}\"}")
            echo "Gitee create response: $RESPONSE"
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
            echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          fi

      - name: Upload APK to Gitee release
        if: env.RELEASE_ID != '' && env.RELEASE_ID != 'null'
        run: |
          if [ -f readtrack.apk ]; then
            FILE_SIZE=$(stat -f%z readtrack.apk 2>/dev/null || stat -c%s readtrack.apk 2>/dev/null)
            echo "Uploading APK (${FILE_SIZE} bytes) to Gitee release $RELEASE_ID..."
            curl -s -X POST \
              "https://gitee.com/api/v5/repos/mosetian/shu-ji-new/releases/${RELEASE_ID}/attach_files?access_token=${{ secrets.GITEE_TOKEN }}" \
              -F "file=@readtrack.apk;filename=readtrack-${RELEASE_TAG}.apk" \
              --connect-timeout 60 --max-time 120
            echo "Upload completed"
          fi
